<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications | DutyPe Admin</title>
    <link rel="stylesheet" href="/admin/admin-styles.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>🎯 DutyPe Admin</h2>
            </div>
            <nav class="nav-menu">
                <a href="/admin/" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Users</span>
                </a>
                <a href="/admin/jobs.html" class="nav-item">
                    <span class="icon">💼</span>
                    <span>Jobs</span>
                </a>
                <a href="/admin/applications.html" class="nav-item active">
                    <span class="icon">📝</span>
                    <span>Applications</span>
                </a>
                <a href="/admin/referrals.html" class="nav-item">
                    <span class="icon">🎁</span>
                    <span>Referrals</span>
                </a>
                <a href="/admin/announcements.html" class="nav-item">
                    <span class="icon">📢</span>
                    <span>Announcements</span>
                </a>
                <a href="javascript:void(0)" class="nav-item" id="logoutBtn">
                    <span class="icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 24px; font-size: 28px;">Applications Management</h1>
            
            <div class="content-card">
                <div class="card-header">
                    <h2>All Applications</h2>
                </div>
                <div class="card-body" style="padding: 0; overflow-x: auto;">
                    <div id="appsTable">
                        <div class="loading"><div class="loading-spinner"></div><p>Loading applications...</p></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCO_0gcUBy0m290p8UPoEOqT_XWc1Gccdo",
            authDomain: "dutypeapp.firebaseapp.com",
            projectId: "dutypeapp",
            storageBucket: "dutypeapp.firebasestorage.app",
            messagingSenderId: "1062348180452",
            appId: "1:1062348180452:web:b48915e74d2469ad0095f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '/admin/login.html';
                return;
            }
            await loadApplications();
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = '/admin/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Error logging out');
            }
        });

        async function loadApplications() {
            try {
                const appsQuery = query(collection(db, 'job_applications'), orderBy('appliedAt', 'desc'), limit(100));
                const snapshot = await getDocs(appsQuery);
                const apps = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                const getBadgeClass = (status) => {
                    switch(status) {
                        case 'ACCEPTED': return 'badge-success';
                        case 'REJECTED': return 'badge-danger';
                        case 'PENDING': return 'badge-warning';
                        default: return 'badge-info';
                    }
                };

                document.getElementById('appsTable').innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Worker Name</th>
                                <th>Phone</th>
                                <th>Job Title</th>
                                <th>Status</th>
                                <th>Applied Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${apps.map(app => `
                                <tr>
                                    <td><strong>${app.workerName || 'N/A'}</strong></td>
                                    <td>${app.workerPhone || 'N/A'}</td>
                                    <td>${app.jobTitle || 'N/A'}</td>
                                    <td><span class="badge ${getBadgeClass(app.status)}">${app.status || 'PENDING'}</span></td>
                                    <td>${app.appliedAt ? new Date(app.appliedAt.seconds * 1000).toLocaleDateString() : 'N/A'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('appsTable').innerHTML = `<p style="color: #EF4444; padding: 20px;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
