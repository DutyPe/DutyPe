<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DutyPe</title>
    <link rel="stylesheet" href="/admin/admin-styles.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>🎯 DutyPe Admin</h2>
            </div>
            <nav class="nav-menu">
                <a href="/admin/" class="nav-item active">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Users</span>
                </a>
                <a href="/admin/jobs.html" class="nav-item">
                    <span class="icon">💼</span>
                    <span>Jobs</span>
                </a>
                <a href="/admin/applications.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>Applications</span>
                </a>
                <a href="/admin/referrals.html" class="nav-item">
                    <span class="icon">🎁</span>
                    <span>Referrals</span>
                </a>
                <a href="/admin/announcements.html" class="nav-item">
                    <span class="icon">📢</span>
                    <span>Announcements</span>
                </a>
                <a href="javascript:void(0)" class="nav-item" id="logoutBtn">
                    <span class="icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 24px; font-size: 28px;">Dashboard</h1>
            
            <div class="stats-grid" id="statsGrid">
                <div class="loading"><div class="loading-spinner"></div><p>Loading stats...</p></div>
            </div>
            
            <div class="content-card">
                <div class="card-header">
                    <h2>Welcome to Admin Panel</h2>
                </div>
                <div class="card-body">
                    <p style="color: #6B7280;">Select a section from the sidebar to manage your platform.</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, query, getDocs, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCO_0gcUBy0m290p8UPoEOqT_XWc1Gccdo",
            authDomain: "dutypeapp.firebaseapp.com",
            projectId: "dutypeapp",
            storageBucket: "dutypeapp.firebasestorage.app",
            messagingSenderId: "1062348180452",
            appId: "1:1062348180452:web:b48915e74d2469ad0095f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '/admin/login.html';
                return;
            }
            await loadDashboard();
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = '/admin/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Error logging out');
            }
        });

        async function loadDashboard() {
            try {
                const [jobsSnap, appsSnap, refsSnap, usersSnap] = await Promise.all([
                    getDocs(query(collection(db, 'jobs'), limit(1000))),
                    getDocs(query(collection(db, 'job_applications'), limit(1000))),
                    getDocs(query(collection(db, 'referrals'), limit(1000))),
                    getDocs(query(collection(db, 'users'), limit(1000)))
                ]);

                const totalJobs = jobsSnap.size;
                const activeJobs = jobsSnap.docs.filter(d => d.data().isActive).length;
                const totalApps = appsSnap.size;
                const pendingApps = appsSnap.docs.filter(d => d.data().status === 'PENDING').length;
                const totalRefs = refsSnap.size;
                const completedRefs = refsSnap.docs.filter(d => d.data().status === 'COMPLETED').length;
                const totalUsers = usersSnap.size;
                const workers = usersSnap.docs.filter(d => {
                    const data = d.data();
                    return data.role === 'WORKER' || data.activeRole === 'WORKER' || (data.roles && data.roles.includes('WORKER'));
                }).length;
                const employers = usersSnap.docs.filter(d => {
                    const data = d.data();
                    return data.role === 'EMPLOYER' || data.activeRole === 'EMPLOYER' || (data.roles && data.roles.includes('EMPLOYER'));
                }).length;

                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <h3>Total Users</h3>
                        <div class="value">${totalUsers}</div>
                        <p style="color: #6B7280; font-size: 12px; margin-top: 4px;">Workers: ${workers} | Employers: ${employers}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Jobs</h3>
                        <div class="value">${totalJobs}</div>
                        <p style="color: #6B7280; font-size: 12px; margin-top: 4px;">Active: ${activeJobs}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Applications</h3>
                        <div class="value">${totalApps}</div>
                        <p style="color: #6B7280; font-size: 12px; margin-top: 4px;">Pending: ${pendingApps}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Referrals</h3>
                        <div class="value">${totalRefs}</div>
                        <p style="color: #6B7280; font-size: 12px; margin-top: 4px;">Completed: ${completedRefs}</p>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('statsGrid').innerHTML = `<p style="color: #EF4444;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
