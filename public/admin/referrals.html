<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referrals | DutyPe Admin</title>
    <link rel="stylesheet" href="/admin/admin-styles.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>🎯 DutyPe Admin</h2>
            </div>
            <nav class="nav-menu">
                <a href="/admin/" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Users</span>
                </a>
                <a href="/admin/jobs.html" class="nav-item">
                    <span class="icon">💼</span>
                    <span>Jobs</span>
                </a>
                <a href="/admin/applications.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>Applications</span>
                </a>
                <a href="/admin/referrals.html" class="nav-item active">
                    <span class="icon">🎁</span>
                    <span>Referrals</span>
                </a>
                <a href="/admin/announcements.html" class="nav-item">
                    <span class="icon">📢</span>
                    <span>Announcements</span>
                </a>
                <a href="javascript:void(0)" class="nav-item" id="logoutBtn">
                    <span class="icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 24px; font-size: 28px;">Referrals Management</h1>
            
            <div class="content-card" style="margin-bottom: 24px;">
                <div class="card-header">
                    <h2>Referrals</h2>
                </div>
                <div class="card-body" style="padding: 0; overflow-x: auto;">
                    <div id="refsTable">
                        <div class="loading"><div class="loading-spinner"></div><p>Loading referrals...</p></div>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <div class="card-header">
                    <h2>Withdrawal Requests</h2>
                </div>
                <div class="card-body" style="padding: 0; overflow-x: auto;">
                    <div id="withdrawalsTable">
                        <div class="loading"><div class="loading-spinner"></div><p>Loading withdrawals...</p></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, query, orderBy, limit, getDocs, updateDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCO_0gcUBy0m290p8UPoEOqT_XWc1Gccdo",
            authDomain: "dutypeapp.firebaseapp.com",
            projectId: "dutypeapp",
            storageBucket: "dutypeapp.firebasestorage.app",
            messagingSenderId: "1062348180452",
            appId: "1:1062348180452:web:b48915e74d2469ad0095f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '/admin/login.html';
                return;
            }
            await loadData();
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = '/admin/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Error logging out');
            }
        });

        async function loadData() {
            try {
                const [refsSnap, withdrawalsSnap] = await Promise.all([
                    getDocs(query(collection(db, 'referrals'), orderBy('createdAt', 'desc'), limit(100))),
                    getDocs(query(collection(db, 'withdrawal_requests'), orderBy('createdAt', 'desc'), limit(50)))
                ]);

                const refs = refsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                const withdrawals = withdrawalsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                document.getElementById('refsTable').innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Referral Code</th>
                                <th>Referred User</th>
                                <th>Status</th>
                                <th>Reward</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${refs.map(ref => `
                                <tr>
                                    <td><strong>${ref.referralCode || 'N/A'}</strong></td>
                                    <td>${ref.referredUserName || 'N/A'}</td>
                                    <td><span class="badge ${ref.status === 'COMPLETED' ? 'badge-success' : 'badge-warning'}">${ref.status || 'PENDING'}</span></td>
                                    <td>₹${ref.rewardAmount || 0}</td>
                                    <td>${ref.createdAt ? new Date(ref.createdAt).toLocaleDateString() : 'N/A'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                document.getElementById('withdrawalsTable').innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Amount</th>
                                <th>Payment Method</th>
                                <th>UPI ID</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${withdrawals.map(w => `
                                <tr>
                                    <td>${w.userId ? w.userId.substring(0, 8) + '...' : 'N/A'}</td>
                                    <td><strong>₹${w.amount || 0}</strong></td>
                                    <td>${w.paymentMethod || 'N/A'}</td>
                                    <td>${w.upiId || 'N/A'}</td>
                                    <td><span class="badge ${w.status === 'COMPLETED' ? 'badge-success' : w.status === 'PENDING' ? 'badge-warning' : 'badge-danger'}">${w.status || 'PENDING'}</span></td>
                                    <td>${w.createdAt ? new Date(w.createdAt.seconds * 1000).toLocaleDateString() : 'N/A'}</td>
                                    <td>
                                        ${w.status === 'PENDING' ? `
                                            <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="approveWithdrawal('${w.id}')">Approve</button>
                                            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="rejectWithdrawal('${w.id}')">Reject</button>
                                        ` : '-'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                window.approveWithdrawal = async (id) => {
                    if (!confirm('Approve this withdrawal?')) return;
                    try {
                        await updateDoc(doc(db, 'withdrawal_requests', id), {
                            status: 'COMPLETED',
                            processedAt: serverTimestamp()
                        });
                        alert('Withdrawal approved!');
                        loadData();
                    } catch (error) {
                        alert('Error: ' + error.message);
                    }
                };

                window.rejectWithdrawal = async (id) => {
                    if (!confirm('Reject this withdrawal?')) return;
                    try {
                        await updateDoc(doc(db, 'withdrawal_requests', id), {
                            status: 'FAILED',
                            processedAt: serverTimestamp()
                        });
                        alert('Withdrawal rejected!');
                        loadData();
                    } catch (error) {
                        alert('Error: ' + error.message);
                    }
                };
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('refsTable').innerHTML = `<p style="color: #EF4444; padding: 20px;">Error: ${error.message}</p>`;
                document.getElementById('withdrawalsTable').innerHTML = `<p style="color: #EF4444; padding: 20px;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
