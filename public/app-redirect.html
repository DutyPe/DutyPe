<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DutyPe - Opening in App</title>
    
    <!-- Android App Links -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3B82F6">
    
    <!-- Open Graph tags removed to prevent WhatsApp link preview (like Nithra/Lokal apps) -->
    <!-- WhatsApp automatically generates previews from OG tags, creating unwanted "Opening DutyPe..." boxes -->
    <!-- Industry standard: Keep URLs clean without preview boxes for better UX -->
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #3B82F6;
            margin-bottom: 10px;
        }
        
        .tagline {
            color: #6B7280;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            color: #1F2937;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        p {
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .btn {
            display: inline-block;
            background: #3B82F6;
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        
        .btn:hover {
            background: #2563EB;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .features {
            margin-top: 40px;
            text-align: left;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #4B5563;
        }
        
        .feature-icon {
            font-size: 24px;
            margin-right: 12px;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: #3B82F6;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading {
            color: #6B7280;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">DutyPe</div>
        <div class="tagline">Find Your Perfect Job</div>
        
        <div class="icon">📱</div>
        
        <h1 id="title">Opening in App...</h1>
        <p id="description">If the app doesn't open automatically, download it from Play Store.</p>
        
        <a href="https://play.google.com/store/apps/details?id=com.dutype.app" class="btn" id="downloadBtn">
            📲 Download DutyPe App
        </a>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div style="margin-top: 10px;">Attempting to open app...</div>
        </div>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">⚡</span>
                <span>Apply to jobs in seconds</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🔔</span>
                <span>Get instant job alerts</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📍</span>
                <span>Find hyperlocal jobs near you</span>
            </div>
            <div class="feature">
                <span class="feature-icon">💰</span>
                <span>Earn rewards for referrals</span>
            </div>
        </div>
    </div>
    
    <script>
        // Universal deep link handler for all routes
        function handleDeepLink() {
            const path = window.location.pathname;
            const pathParts = path.split('/').filter(p => p);
            
            // Build app scheme deep link
            let appScheme = 'dutype://';
            
            if (pathParts.length >= 2) {
                // Format: /jobs/123 -> dutype://job/123
                // Format: /refer/ABC -> dutype://refer/ABC
                const type = pathParts[0];
                const id = pathParts[1];
                
                // Map web paths to app schemes
                const pathMap = {
                    'jobs': 'job',
                    'refer': 'refer',
                    'worker': 'worker',
                    'application': 'application',
                    'employer': 'employer',
                    'chat': 'chat'
                };
                
                const appType = pathMap[type] || type;
                appScheme += `${appType}/${id}`;
            } else if (pathParts.length === 1) {
                // Format: /profile -> dutype://profile
                appScheme += pathParts[0];
            } else {
                // Default to home
                appScheme += 'home';
            }
            
            console.log('Deep link:', appScheme);
            
            // Try to open app
            window.location.href = appScheme;
            
            // After 2.5 seconds, if still on page, show download message
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('title').textContent = 'App Not Installed?';
                document.getElementById('description').textContent = 'Download DutyPe to access this content and discover thousands of opportunities near you!';
                document.querySelector('.icon').textContent = '📲';
            }, 2500);
        }
        
        // Run on page load
        handleDeepLink();
        
        // Track Play Store button click
        document.getElementById('downloadBtn').addEventListener('click', () => {
            console.log('Play Store button clicked');
            // Optional: Add analytics tracking here
        });
        
        // Handle visibility change (user returns to tab)
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // User returned to tab, app probably didn't open
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('title').textContent = 'App Not Installed?';
                    document.getElementById('description').textContent = 'Download DutyPe to access this content!';
                }, 500);
            }
        });
    </script>
</body>
</html>
