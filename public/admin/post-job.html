<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Post Job | DutyPe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            font-size: 14px;
        }

        label .required {
            color: #EF4444;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message, .error-message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #10B981;
        }

        .error-message {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #EF4444;
        }

        .helper-text {
            font-size: 12px;
            color: #6B7280;
            margin-top: 4px;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .form-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="logout-btn" onclick="logout()">Logout</button>
            <h1>🚀 Post New Job</h1>
            <p>Admin Panel - DutyPe Job Posting</p>
        </div>

        <div class="form-container">
            <div class="success-message" id="successMessage"></div>
            <div class="error-message" id="errorMessage"></div>

            <form id="jobForm">
                <!-- Job Title -->
                <div class="form-group">
                    <label>Job Title <span class="required">*</span></label>
                    <input type="text" id="title" required placeholder="e.g., Delivery Partner, Cook, Driver">
                </div>

                <!-- Company Name -->
                <div class="form-group">
                    <label>Company Name <span class="required">*</span></label>
                    <input type="text" id="companyName" required placeholder="e.g., ABC Restaurant, XYZ Logistics">
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label>Job Description <span class="required">*</span></label>
                    <textarea id="description" required placeholder="Describe the job responsibilities, requirements, and benefits..."></textarea>
                </div>

                <!-- Location & Category -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Location <span class="required">*</span></label>
                        <input type="text" id="location" required placeholder="e.g., Khammam, Hyderabad">
                    </div>
                    <div class="form-group">
                        <label>Category <span class="required">*</span></label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Delivery">Delivery</option>
                            <option value="Driver">Driver</option>
                            <option value="Cook">Cook / Chef</option>
                            <option value="Cleaner">Cleaner / Housekeeping</option>
                            <option value="Waiter">Waiter / Server</option>
                            <option value="Security">Security Guard</option>
                            <option value="Helper">Helper / Labour</option>
                            <option value="Office">Office / Admin</option>
                            <option value="Sales">Sales / Marketing</option>
                            <option value="Retail">Retail / Shop</option>
                            <option value="Warehouse">Warehouse / Packing</option>
                            <option value="Construction">Construction</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Pay Amount & Pay Type -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Pay Amount (₹) <span class="required">*</span></label>
                        <input type="number" id="payAmount" required placeholder="e.g., 15000">
                        <div class="helper-text">Enter amount without ₹ symbol</div>
                    </div>
                    <div class="form-group">
                        <label>Pay Type <span class="required">*</span></label>
                        <select id="payType" required>
                            <option value="">Select Pay Type</option>
                            <option value="per month">Per Month</option>
                            <option value="per day">Per Day</option>
                            <option value="per hour">Per Hour</option>
                            <option value="per delivery">Per Delivery</option>
                        </select>
                    </div>
                </div>

                <!-- Job Type & Vacancies -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Job Type <span class="required">*</span></label>
                        <select id="jobType" required>
                            <option value="">Select Job Type</option>
                            <option value="Full-time">Full-time</option>
                            <option value="Part-time">Part-time</option>
                            <option value="Contract">Contract</option>
                            <option value="Temporary">Temporary</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Vacancies <span class="required">*</span></label>
                        <input type="number" id="vacancies" required min="1" value="1">
                    </div>
                </div>

                <!-- Gender & Shift Timing -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Gender Preference</label>
                        <select id="gender">
                            <option value="Any">Any</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Shift Timing</label>
                        <input type="text" id="shiftTiming" placeholder="e.g., 9 AM - 6 PM, Night Shift">
                    </div>
                </div>

                <!-- Contact Details -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Contact Phone <span class="required">*</span></label>
                        <input type="tel" id="contactPhone" required placeholder="e.g., 9876543210">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="whatsappNumber" placeholder="e.g., 9876543210">
                    </div>
                </div>

                <!-- Coordinates (Optional) -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Latitude (Optional)</label>
                        <input type="number" step="any" id="latitude" placeholder="e.g., 17.2473">
                    </div>
                    <div class="form-group">
                        <label>Longitude (Optional)</label>
                        <input type="number" step="any" id="longitude" placeholder="e.g., 80.1514">
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    Post Job
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, doc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCO_0gcUBy0m290p8UPoEOqT_XWc1Gccdo",
            authDomain: "dutypeapp.firebaseapp.com",
            projectId: "dutypeapp",
            storageBucket: "dutypeapp.firebasestorage.app",
            messagingSenderId: "1062348180452",
            appId: "1:1062348180452:web:b48915e74d2469ad0095f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check authentication
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // Redirect to login if not authenticated
                window.location.href = '/admin/login.html';
            }
        });

        // Logout function
        window.logout = async function() {
            try {
                await signOut(auth);
                window.location.href = '/admin/login.html';
            } catch (error) {
                console.error('Logout error:', error);
            }
        };

        // Form submission
        document.getElementById('jobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            // Hide previous messages
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Posting Job...';
            
            try {
                const jobData = {
                    title: document.getElementById('title').value.trim(),
                    companyName: document.getElementById('companyName').value.trim(),
                    description: document.getElementById('description').value.trim(),
                    location: document.getElementById('location').value.trim(),
                    category: document.getElementById('category').value,
                    payAmount: document.getElementById('payAmount').value,
                    payType: document.getElementById('payType').value,
                    jobType: document.getElementById('jobType').value,
                    vacancies: parseInt(document.getElementById('vacancies').value),
                    gender: document.getElementById('gender').value,
                    shiftTiming: document.getElementById('shiftTiming').value.trim(),
                    contactPhone: document.getElementById('contactPhone').value.trim(),
                    whatsappNumber: document.getElementById('whatsappNumber').value.trim() || document.getElementById('contactPhone').value.trim(),
                    
                    // Optional coordinates
                    latitude: parseFloat(document.getElementById('latitude').value) || 0,
                    longitude: parseFloat(document.getElementById('longitude').value) || 0,
                    
                    // System fields
                    employerId: 'admin',
                    employerName: 'DutyPe Admin',
                    isActive: true,
                    isFilled: false,
                    createdAt: Date.now(),
                    postedAt: Date.now(),
                    updatedAt: Date.now()
                };
                
                // Add to Firestore
                const docRef = await addDoc(collection(db, 'jobs'), jobData);
                
                // Update document with its own ID
                await updateDoc(doc(db, 'jobs', docRef.id), {
                    id: docRef.id
                });
                
                // Show success message
                successMsg.textContent = `✅ Job posted successfully! Job ID: ${docRef.id}`;
                successMsg.style.display = 'block';
                
                // Reset form
                document.getElementById('jobForm').reset();
                
                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = '/admin/dashboard.html';
                }, 2000);
                
            } catch (error) {
                console.error('Error posting job:', error);
                errorMsg.textContent = `❌ Error: ${error.message}`;
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Post Job';
            }
        });
    </script>
</body>
</html>
