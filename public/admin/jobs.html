<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs Management | DutyPe Admin</title>
    <link rel="stylesheet" href="/admin/admin-styles.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>🎯 DutyPe Admin</h2>
            </div>
            <nav class="nav-menu">
                <a href="/admin/" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Users</span>
                </a>
                <a href="/admin/jobs.html" class="nav-item active">
                    <span class="icon">💼</span>
                    <span>Jobs</span>
                </a>
                <a href="/admin/applications.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>Applications</span>
                </a>
                <a href="/admin/referrals.html" class="nav-item">
                    <span class="icon">🎁</span>
                    <span>Referrals</span>
                </a>
                <a href="/admin/announcements.html" class="nav-item">
                    <span class="icon">📢</span>
                    <span>Announcements</span>
                </a>
                <a href="javascript:void(0)" class="nav-item" id="logoutBtn">
                    <span class="icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 24px; font-size: 28px;">Jobs Management</h1>
            
            <div class="content-card">
                <div class="card-header">
                    <h2>All Jobs</h2>
                </div>
                <div class="card-body" style="padding: 0; overflow-x: auto;">
                    <div id="jobsTable">
                        <div class="loading"><div class="loading-spinner"></div><p>Loading jobs...</p></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, query, orderBy, limit, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCO_0gcUBy0m290p8UPoEOqT_XWc1Gccdo",
            authDomain: "dutypeapp.firebaseapp.com",
            projectId: "dutypeapp",
            storageBucket: "dutypeapp.firebasestorage.app",
            messagingSenderId: "1062348180452",
            appId: "1:1062348180452:web:b48915e74d2469ad0095f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '/admin/login.html';
                return;
            }
            await loadJobs();
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = '/admin/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Error logging out');
            }
        });

        async function loadJobs() {
            try {
                const jobsQuery = query(collection(db, 'jobs'), orderBy('createdAt', 'desc'), limit(100));
                const snapshot = await getDocs(jobsQuery);
                const jobs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                document.getElementById('jobsTable').innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Company</th>
                                <th>Location</th>
                                <th>Salary</th>
                                <th>Vacancies</th>
                                <th>Status</th>
                                <th>Applications</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${jobs.map(job => `
                                <tr>
                                    <td><strong>${job.title || 'N/A'}</strong></td>
                                    <td>${job.companyName || 'N/A'}</td>
                                    <td>${job.location || 'N/A'}</td>
                                    <td>₹${job.payAmount || 0} ${job.payType || ''}</td>
                                    <td>${job.vacancies || 0}</td>
                                    <td><span class="badge ${job.isActive ? 'badge-success' : 'badge-danger'}">${job.isActive ? 'Active' : 'Inactive'}</span></td>
                                    <td>${job.applicationCount || 0}</td>
                                    <td>
                                        <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteJob('${job.id}')">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                window.deleteJob = async (jobId) => {
                    if (!confirm('Delete this job?')) return;
                    try {
                        await deleteDoc(doc(db, 'jobs', jobId));
                        alert('Job deleted!');
                        loadJobs();
                    } catch (error) {
                        alert('Error: ' + error.message);
                    }
                };
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('jobsTable').innerHTML = `<p style="color: #EF4444; padding: 20px;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
