# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
# Kotlin compiler daemon JVM arguments (fix for daemon connection issues)
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:-UseParallelGC
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
# Enable Gradle build cache
org.gradle.caching=true
# Enable parallel execution
org.gradle.parallel=true
# Enable daemon with increased timeout for stability
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000
org.gradle.configuration-cache=true

# Release-size guardrails. `:app:bundleRelease` fails when these budgets are
# crossed, so tiny Play hotfixes cannot silently ship multi-MB dex/resource churn.
# This hash must match the R8 mapping from the currently live Play release.
# Update it only after Play accepts the matching AAB and `:app:archiveReleaseMapping`
# refreshes `app/mapping/release-mapping.txt` for the next release.
com.dutype.releaseMappingSha256=D2D72537BD0B264AF5FC06B3E8A4FE602B2F2EC412594DB0A40E34A98E816AD9
com.dutype.allowMissingReleaseMapping=true
com.dutype.maxReleaseAabMb=25.0
com.dutype.maxReleaseDexFiles=3
com.dutype.maxReleaseDexRawMb=15.0
com.dutype.maxReleaseDexCompressedMb=7.0
com.dutype.maxReleaseResourcesMb=2.5