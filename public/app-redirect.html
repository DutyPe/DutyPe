<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening DutyPe...</title>
    <meta name="description" content="Opening in DutyPe app...">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1F2937 0%, #374151 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            opacity: 0.9;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 24px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            background: #10B981;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 16px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #059669;
        }
        .secondary-btn {
            display: inline-block;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 12px;
        }
        .secondary-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏢</div>
        <h1>Opening DutyPe...</h1>
        <p id="status">Checking if app is installed...</p>
        <div class="spinner"></div>
        <div id="fallback" style="display: none;">
            <p>Don't have the app yet?</p>
            <a href="https://play.google.com/store/apps/details?id=com.dutype.app" class="btn">
                Download from Play Store
            </a>
            <br>
            <a href="/" class="secondary-btn">Continue on Web</a>
        </div>
    </div>

    <script>
        // Get the current URL path and parameters
        const currentPath = window.location.pathname;
        const currentParams = window.location.search;
        const fullPath = currentPath + currentParams;
        
        // Configuration
        const config = {
            packageName: 'com.dutype.app',
            playStoreUrl: 'https://play.google.com/store/apps/details?id=com.dutype.app',
            appScheme: 'dutype',
            webHost: 'dutypeapp.web.app'
        };
        
        // Parse the path to create deep link
        function createDeepLink() {
            // Remove leading slash
            let path = currentPath.replace(/^\//, '');
            
            // Parse path segments
            const segments = path.split('/').filter(s => s);
            
            if (segments.length === 0) {
                return null;
            }
            
            // Build app scheme URL
            // Example: /jobs/123 -> dutype://job/123
            // Example: /refer/ABC -> dutype://refer/ABC
            const host = segments[0].replace(/s$/, ''); // Remove trailing 's' (jobs -> job)
            const rest = segments.slice(1).join('/');
            
            return `${config.appScheme}://${host}${rest ? '/' + rest : ''}${currentParams}`;
        }
        
        // Create Android Intent URL (most reliable method for Android)
        function createIntentUrl() {
            const deepLink = createDeepLink();
            if (!deepLink) return null;
            
            // Remove scheme from deep link
            const path = deepLink.replace(`${config.appScheme}://`, '');
            
            // Build intent URL
            // Format: intent://HOST/PATH#Intent;scheme=SCHEME;package=PACKAGE;end
            return `intent://${path}#Intent;scheme=${config.appScheme};package=${config.packageName};S.browser_fallback_url=${encodeURIComponent(config.playStoreUrl)};end`;
        }
        
        // Try to open the app
        function tryOpenApp() {
            const deepLink = createDeepLink();
            const intentUrl = createIntentUrl();
            
            if (!deepLink || !intentUrl) {
                // Invalid path, redirect to home
                window.location.href = '/';
                return;
            }
            
            console.log('Deep link:', deepLink);
            console.log('Intent URL:', intentUrl);
            
            // Update status
            document.getElementById('status').textContent = 'Opening app...';
            
            // Detect if on Android
            const isAndroid = /Android/i.test(navigator.userAgent);
            const isChrome = /Chrome/i.test(navigator.userAgent);
            
            if (isAndroid) {
                // On Android, use intent URL (most reliable)
                // This will:
                // 1. Open the app if installed
                // 2. Redirect to Play Store if not installed
                setTimeout(() => {
                    window.location.href = intentUrl;
                }, 100);
            } else {
                // On other platforms, try app scheme
                const startTime = Date.now();
                
                // Try to open app
                window.location.href = deepLink;
                
                // Check if app opened after 2 seconds
                setTimeout(() => {
                    if (!document.hidden) {
                        // App didn't open, show fallback
                        document.getElementById('status').textContent = 'App not installed';
                        document.getElementById('fallback').style.display = 'block';
                        document.querySelector('.spinner').style.display = 'none';
                    }
                }, 2000);
                
                // Redirect to Play Store after 3 seconds
                setTimeout(() => {
                    if (!document.hidden) {
                        window.location.href = config.playStoreUrl;
                    }
                }, 3000);
            }
        }
        
        // Handle visibility change (app opened if page becomes hidden)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('App opened successfully');
            }
        });
        
        // Handle page focus loss (another indicator app opened)
        window.addEventListener('blur', () => {
            console.log('Page lost focus - app may have opened');
        });
        
        // Start the process after a short delay
        setTimeout(tryOpenApp, 300);
    </script>
</body>
</html>
