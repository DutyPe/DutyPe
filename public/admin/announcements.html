<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | DutyPe Admin</title>
    <link rel="stylesheet" href="/admin/admin-styles.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>🎯 DutyPe Admin</h2>
            </div>
            <nav class="nav-menu">
                <a href="/admin/" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Users</span>
                </a>
                <a href="/admin/jobs.html" class="nav-item">
                    <span class="icon">💼</span>
                    <span>Jobs</span>
                </a>
                <a href="/admin/applications.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>Applications</span>
                </a>
                <a href="/admin/referrals.html" class="nav-item">
                    <span class="icon">🎁</span>
                    <span>Referrals</span>
                </a>
                <a href="/admin/announcements.html" class="nav-item active">
                    <span class="icon">📢</span>
                    <span>Announcements</span>
                </a>
                <a href="javascript:void(0)" class="nav-item" id="logoutBtn">
                    <span class="icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h1 style="font-size: 28px;">Announcements Management</h1>
                <button class="btn btn-primary" id="createBtn">+ Create Announcement</button>
            </div>
            
            <div class="content-card">
                <div class="card-header">
                    <h2>All Announcements</h2>
                </div>
                <div class="card-body" style="padding: 0; overflow-x: auto;">
                    <div id="announcementsTable">
                        <div class="loading"><div class="loading-spinner"></div><p>Loading announcements...</p></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, query, orderBy, limit, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCO_0gcUBy0m290p8UPoEOqT_XWc1Gccdo",
            authDomain: "dutypeapp.firebaseapp.com",
            projectId: "dutypeapp",
            storageBucket: "dutypeapp.firebasestorage.app",
            messagingSenderId: "1062348180452",
            appId: "1:1062348180452:web:b48915e74d2469ad0095f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '/admin/login.html';
                return;
            }
            await loadAnnouncements();
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = '/admin/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Error logging out');
            }
        });

        document.getElementById('createBtn').addEventListener('click', () => {
            const title = prompt('Enter announcement title:');
            if (!title) return;
            
            const message = prompt('Enter announcement message:');
            if (!message) return;
            
            const type = prompt('Enter type (INFO, WARNING, SUCCESS, ERROR):', 'INFO');
            const targetRole = prompt('Target role (ALL, WORKER, EMPLOYER):', 'ALL');
            
            createAnnouncement(title, message, type, targetRole);
        });

        async function createAnnouncement(title, message, type, targetRole) {
            try {
                await addDoc(collection(db, 'announcements'), {
                    title,
                    message,
                    type: type.toUpperCase(),
                    targetRole: targetRole.toUpperCase(),
                    isActive: true,
                    createdAt: serverTimestamp(),
                    priority: 1
                });
                alert('Announcement created!');
                loadAnnouncements();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function loadAnnouncements() {
            try {
                const announcementsQuery = query(collection(db, 'announcements'), orderBy('createdAt', 'desc'), limit(50));
                const snapshot = await getDocs(announcementsQuery);
                const announcements = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                document.getElementById('announcementsTable').innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Message</th>
                                <th>Type</th>
                                <th>Target</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${announcements.map(ann => `
                                <tr>
                                    <td><strong>${ann.title || 'N/A'}</strong></td>
                                    <td>${(ann.message || '').substring(0, 50)}...</td>
                                    <td><span class="badge badge-info">${ann.type || 'INFO'}</span></td>
                                    <td>${ann.targetRole || 'ALL'}</td>
                                    <td><span class="badge ${ann.isActive ? 'badge-success' : 'badge-danger'}">${ann.isActive ? 'Active' : 'Inactive'}</span></td>
                                    <td>${ann.createdAt ? new Date(ann.createdAt.seconds * 1000).toLocaleDateString() : 'N/A'}</td>
                                    <td>
                                        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="toggleAnnouncement('${ann.id}', ${!ann.isActive})">
                                            ${ann.isActive ? 'Deactivate' : 'Activate'}
                                        </button>
                                        <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteAnnouncement('${ann.id}')">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                window.toggleAnnouncement = async (id, isActive) => {
                    try {
                        await updateDoc(doc(db, 'announcements', id), { isActive });
                        alert(`Announcement ${isActive ? 'activated' : 'deactivated'}!`);
                        loadAnnouncements();
                    } catch (error) {
                        alert('Error: ' + error.message);
                    }
                };

                window.deleteAnnouncement = async (id) => {
                    if (!confirm('Delete this announcement?')) return;
                    try {
                        await deleteDoc(doc(db, 'announcements', id));
                        alert('Announcement deleted!');
                        loadAnnouncements();
                    } catch (error) {
                        alert('Error: ' + error.message);
                    }
                };
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('announcementsTable').innerHTML = `<p style="color: #EF4444; padding: 20px;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
