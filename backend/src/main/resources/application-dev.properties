# Cosmos DB MongoDB API Configuration (for dev)
spring.data.mongodb.uri=mongodb://parttimes-cosmosdb-vamsi:SmV8xSjc3zgaCQKaDc5FdyvDEfIhn9qBJorePgnEE5XNuSBRtOjd6o2xv338pQ3FWWKfGgNWNbj9ACDbBXe6PA==@parttimes-cosmosdb-vamsi.mongo.cosmos.azure.com:10255/?ssl=true&replicaSet=globaldb&retrywrites=false&maxIdleTimeMS=120000&appName=@parttimes-cosmosdb-vamsi@
