<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test Referral | DutyPe Admin</title>
    <link rel="stylesheet" href="/admin/admin-styles.css">
    <style>
        .log-output {
            background: #1F2937;
            color: #10B981;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 20px;
        }
        .log-error { color: #EF4444; }
        .log-success { color: #10B981; }
        .log-info { color: #60A5FA; }
        .log-warning { color: #F59E0B; }
    </style>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>🎯 DutyPe Admin</h2>
            </div>
            <nav class="nav-menu">
                <a href="/admin/" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/users.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Users</span>
                </a>
                <a href="/admin/jobs.html" class="nav-item">
                    <span class="icon">💼</span>
                    <span>Jobs</span>
                </a>
                <a href="/admin/applications.html" class="nav-item">
                    <span class="icon">📝</span>
                    <span>Applications</span>
                </a>
                <a href="/admin/referrals.html" class="nav-item">
                    <span class="icon">🎁</span>
                    <span>Referrals</span>
                </a>
                <a href="/admin/announcements.html" class="nav-item">
                    <span class="icon">📢</span>
                    <span>Announcements</span>
                </a>
                <a href="javascript:void(0)" class="nav-item" id="logoutBtn">
                    <span class="icon">🚪</span>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 24px; font-size: 28px;">Create Test Referral</h1>
            
            <div class="content-card" style="margin-bottom: 24px;">
                <div class="card-header">
                    <h2>Test Referral System</h2>
                </div>
                <div class="card-body">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Referral Code:</label>
                        <input type="text" id="referralCode" value="WRKG0XBC8" style="width: 300px; padding: 10px; border: 2px solid #E5E7EB; border-radius: 8px; font-size: 14px; text-transform: uppercase;">
                    </div>
                    <button class="btn btn-primary" onclick="createTestReferral()" id="testBtn">
                        🧪 Create Test Referral (+₹50)
                    </button>
                    <p style="margin-top: 12px; color: #6B7280; font-size: 14px;">
                        This will create a test referral and credit ₹50 to the referrer's account.
                    </p>
                </div>
            </div>

            <div class="content-card">
                <div class="card-header">
                    <h2>Test Output</h2>
                </div>
                <div class="card-body">
                    <div id="logOutput" class="log-output">
                        Ready to test referral system...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, setDoc, updateDoc, increment, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCO_0gcUBy0m290p8UPoEOqT_XWc1Gccdo",
            authDomain: "dutypeapp.firebaseapp.com",
            projectId: "dutypeapp",
            storageBucket: "dutypeapp.firebasestorage.app",
            messagingSenderId: "1062348180452",
            appId: "1:1062348180452:web:b48915e74d2469ad0095f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = '/admin/login.html';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = '/admin/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Error logging out');
            }
        });

        function log(message, type = 'info') {
            const output = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString();
            const className = `log-${type}`;
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        function clearLog() {
            document.getElementById('logOutput').innerHTML = '';
        }

        window.createTestReferral = async function() {
            let codeInput = document.getElementById('referralCode').value.trim().toLowerCase();
            const testBtn = document.getElementById('testBtn');
            
            if (!codeInput) {
                alert('Please enter a referral code');
                return;
            }
            
            testBtn.disabled = true;
            testBtn.textContent = '⏳ Testing...';
            clearLog();
            
            log('🎯 Testing Referral System', 'info');
            log('='.repeat(60), 'info');
            log('Referral Code: ' + codeInput.toUpperCase(), 'info');
            log('', 'info');
            
            try {
                // Step 1: Check if code exists in referral_codes collection
                log('📋 Step 1: Checking referral code...', 'info');
                
                // Try lowercase first (Cloud Function format)
                let codeDoc = await getDoc(doc(db, 'referral_codes', codeInput));
                
                // If not found, try uppercase
                if (!codeDoc.exists()) {
                    const upperCode = codeInput.toUpperCase();
                    codeDoc = await getDoc(doc(db, 'referral_codes', upperCode));
                    if (codeDoc.exists()) {
                        log('✅ Found code in uppercase format: ' + upperCode, 'success');
                        codeInput = upperCode; // Use uppercase for rest of operations
                    }
                }
                
                let codeData;
                
                if (!codeDoc.exists()) {
                    log('⚠️  Code not found in referral_codes collection', 'warning');
                    log('   Searching in users collection (trying both cases)...', 'info');
                    
                    // Try lowercase query first
                    let usersQuery = query(collection(db, 'users'), where('referralCode', '==', codeInput));
                    let usersSnapshot = await getDocs(usersQuery);
                    
                    // If not found, try uppercase
                    if (usersSnapshot.empty) {
                        const upperCode = codeInput.toUpperCase();
                        log('   Trying uppercase: ' + upperCode, 'info');
                        usersQuery = query(collection(db, 'users'), where('referralCode', '==', upperCode));
                        usersSnapshot = await getDocs(usersQuery);
                        if (!usersSnapshot.empty) {
                            codeInput = upperCode; // Use uppercase for rest of operations
                        }
                    }
                    
                    if (usersSnapshot.empty) {
                        log('❌ ERROR: Referral code does not exist anywhere!', 'error');
                        log('   Tried both lowercase and uppercase formats.', 'error');
                        log('   Use the "Check & Create Code" page to create it first.', 'error');
                        testBtn.disabled = false;
                        testBtn.textContent = '🧪 Create Test Referral (+₹50)';
                        return;
                    }
                    
                    const userDoc = usersSnapshot.docs[0];
                    const userData = userDoc.data();
                    
                    log('✅ Found code in users collection!', 'success');
                    log('   User ID: ' + userDoc.id, 'info');
                    log('   Creating referral_codes document...', 'info');
                    
                    // Create the missing referral_codes document (use the actual case from users collection)
                    const actualCode = userData.referralCode || codeInput;
                    await setDoc(doc(db, 'referral_codes', actualCode), {
                        code: actualCode,
                        userId: userDoc.id,
                        userRole: userData.role || 'WORKER',
                        userName: userData.name || userData.fullName || 'User',
                        isActive: true,
                        createdAt: serverTimestamp(),
                        totalUsed: 0
                    });
                    
                    log('✅ Created referral_codes document with code: ' + actualCode, 'success');
                    
                    codeData = {
                        code: actualCode,
                        userId: userDoc.id,
                        userRole: userData.role || 'WORKER',
                        userName: userData.name || userData.fullName || 'User',
                        isActive: true
                    };
                    
                    codeInput = actualCode; // Update for rest of operations
                } else {
                    codeData = codeDoc.data();
                    log('✅ Code exists in referral_codes collection!', 'success');
                }
                log('✅ Code exists!', 'success');
                log('   Referrer ID: ' + codeData.userId, 'info');
                
                // Step 2: Get referrer current stats
                log('', 'info');
                log('👤 Step 2: Getting referrer current stats...', 'info');
                const referrerDoc = await getDoc(doc(db, 'users', codeData.userId));
                
                if (!referrerDoc.exists()) {
                    log('❌ ERROR: Referrer user not found!', 'error');
                    testBtn.disabled = false;
                    testBtn.textContent = '🧪 Create Test Referral (+₹50)';
                    return;
                }
                
                const referrerData = referrerDoc.data();
                log('✅ Referrer found!', 'success');
                log('   Name: ' + (referrerData.name || referrerData.fullName || 'N/A'), 'info');
                log('   Phone: ' + (referrerData.phone || 'N/A'), 'info');
                log('   Current Earnings: ₹' + (referrerData.referralEarnings || 0), 'info');
                log('   Successful Referrals: ' + (referrerData.successfulReferrals || 0), 'info');
                
                // Step 3: Create test referral
                log('', 'info');
                log('🎁 Step 3: Creating test referral...', 'info');
                const testUserId = 'TEST_USER_' + Date.now();
                const testPhone = '+919999999999';
                const referralId = `${codeData.userId}_${testUserId}`;
                
                await setDoc(doc(db, 'referrals', referralId), {
                    referralCode: codeInput,
                    referrerUserId: codeData.userId,
                    referredUserId: testUserId,
                    referredUserName: 'Test User',
                    referredUserPhone: testPhone,
                    referredUserRole: 'WORKER',
                    status: 'COMPLETED',
                    rewardAmount: 50,
                    createdAt: serverTimestamp(),
                    completedAt: serverTimestamp(),
                    expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)
                });
                log('✅ Test referral created!', 'success');
                log('   Referral ID: ' + referralId, 'info');
                
                // Step 4: Update referrer stats
                log('', 'info');
                log('💰 Step 4: Updating referrer earnings...', 'info');
                await updateDoc(doc(db, 'users', codeData.userId), {
                    referralEarnings: increment(50),
                    successfulReferrals: increment(1),
                    totalReferrals: increment(1)
                });
                log('✅ Earnings updated! Added ₹50', 'success');
                
                // Step 5: Verify results
                log('', 'info');
                log('🔍 Step 5: Verifying results...', 'info');
                const updatedReferrerDoc = await getDoc(doc(db, 'users', codeData.userId));
                const updatedData = updatedReferrerDoc.data();
                
                log('✅ Updated Stats:', 'success');
                log('   New Earnings: ₹' + (updatedData.referralEarnings || 0), 'success');
                log('   New Successful Referrals: ' + (updatedData.successfulReferrals || 0), 'success');
                log('   Increase: +₹50, +1 referral', 'success');
                
                // Step 6: Check all referrals
                log('', 'info');
                log('📊 Step 6: Checking all referrals for this code...', 'info');
                const referralsQuery = query(collection(db, 'referrals'), where('referralCode', '==', codeInput));
                const referralsSnapshot = await getDocs(referralsQuery);
                
                log('✅ Total referrals: ' + referralsSnapshot.size, 'success');
                referralsSnapshot.forEach((doc, index) => {
                    const ref = doc.data();
                    log('', 'info');
                    log('   Referral #' + (index + 1) + ':', 'info');
                    log('     User: ' + ref.referredUserName, 'info');
                    log('     Phone: ' + ref.referredUserPhone, 'info');
                    log('     Status: ' + ref.status, 'info');
                    log('     Reward: ₹' + ref.rewardAmount, 'info');
                });
                
                log('', 'info');
                log('✅ TEST COMPLETED SUCCESSFULLY!', 'success');
                log('', 'info');
                log('📱 Check in app:', 'warning');
                log('   - Open Refer & Earn screen', 'warning');
                log('   - You should see earnings: ₹' + (updatedData.referralEarnings || 0), 'warning');
                log('   - Successful referrals: ' + (updatedData.successfulReferrals || 0), 'warning');
                log('', 'info');
                log('🌐 Check in admin panel:', 'warning');
                log('   - Go to: https://dutypeapp.web.app/admin/referrals.html', 'warning');
                log('   - Or: https://dutypeapp.web.app/admin/test-referral.html', 'warning');
                log('   - You should see the test referral', 'warning');
                
            } catch (error) {
                log('', 'info');
                log('❌ ERROR: ' + error.message, 'error');
                console.error(error);
            }
            
            testBtn.disabled = false;
            testBtn.textContent = '🧪 Create Test Referral (+₹50)';
        };
    </script>
</body>
</html>
